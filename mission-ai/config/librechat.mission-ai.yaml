version: 1.3.17
cache: true

interface:
  contextUsage: true
  contextCost: true
  currency:
    code: USD
    rate: 1

transactions:
  enabled: true


mcpServers:
  mission-ai:
    title: Mission AI
    type: streamable-http
    url: '${MISSION_AI_GATEWAY_URL}/mcp'
    headers:
      Authorization: 'Bearer ${MISSION_AI_TOOL_TOKEN}'
    timeout: 120000
    chatMenu: true

# LibreChat uses micro-USD-equivalent token credits:
# 1,000 credits = $0.001, therefore 175,000,000 credits = $175.
# The Mission AI budget plugin reconciles this remaining balance to current-month
# settled spend before each user prompt. LibreChat's native balance reservations
# then protect the remaining balance while requests are in flight.
balance:
  enabled: true
  startBalance: 175000000
  autoRefillEnabled: false
  reservationTtlMs: 1800000

endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 90
    maxSubagents: 10
    capabilities:
      - deferred_tools
      - execute_code
      - file_search
      - web_search
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - memory
      - ask_user_question
      - tools
      - chain
      - ocr
      - run_in_background
      - tool_intents
      - stateful_code_sessions
    statefulCodeSessions:
      allowedEnvironments:
        - user
        - agent-user
        - conversation
      conversationMoves:
        enabled: true
        allowAttachDetach: true
      environments:
        - id: attached-workers
          name: Mission AI Mac
          type: attached
          baseURL: https://mission-ai-code-api-mckee.onrender.com/v1
          owner: deployment
          pairing:
            workerId: mac-primary-code
            tokenEnv: MISSION_AI_CODE_BRIDGE_ADMIN_TOKEN
          default: true
    toolApproval:
      enabled: true
      mode: default
      allow:
        - 'web_search'
        - 'file_search'
        - 'mcp:mission-ai:mission_readiness'
        - 'mcp:mission-ai:mission_cost_dashboard'
        - 'mcp:mission-ai:mission_route'
        - 'mcp:mission-ai:browser_get_state'
        - 'mcp:mission-ai:mac_active_app'
        - 'mcp:mission-ai:mac_screenshot'
      deny:
        - 'mcp:*:delete_*'
      ask:
        - 'mcp:mission-ai:browser_click'
        - 'mcp:mission-ai:browser_type'
        - 'mcp:mission-ai:browser_scroll'
        - 'mcp:mission-ai:browser_open_url'
        - 'mcp:mission-ai:mac_open_app'
        - 'mcp:mission-ai:mac_click'
        - 'mcp:mission-ai:mac_type'
        - 'mcp:mission-ai:mac_key'
        - 'mcp:*:*'
      reason: 'Review {tool} before it runs.'
    checkpointer:
      type: mongo
      ttl: 86400
