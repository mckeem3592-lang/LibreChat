version: 1.3.17
cache: true

interface:
  contextUsage: true
  contextCost: true
  currency:
    code: USD
    rate: 1

transactions:
  enabled: true

# LibreChat uses micro-USD-equivalent token credits:
# 1,000 credits = $0.001, therefore 175,000,000 credits = $175.
# The Mission AI budget plugin reconciles this remaining balance to current-month
# settled spend before each user prompt. LibreChat's native balance reservations
# then protect the remaining balance while requests are in flight.
balance:
  enabled: true
  startBalance: 175000000
  autoRefillEnabled: false
  reservationTtlMs: 1800000

endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 90
    maxSubagents: 10
    capabilities:
      - deferred_tools
      - execute_code
      - file_search
      - web_search
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - memory
      - ask_user_question
      - tools
      - chain
      - ocr
      - run_in_background
      - tool_intents
    toolApproval:
      enabled: true
      mode: default
      allow:
        - 'web_search'
        - 'file_search'
      deny:
        - 'mcp:*:delete_*'
      ask:
        - 'mcp:*:*'
      reason: 'Review {tool} before it runs.'
    checkpointer:
      type: mongo
      ttl: 86400
