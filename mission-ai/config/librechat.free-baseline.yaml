# Mission AI free-baseline configuration.
# Gemini-only, tools-off, managed text chat for zero-cost baseline verification.
version: 1.3.17
cache: true

interface:
  modelSelect: true
  parameters: false
  multiConvo: false
  presets: false
  agents: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  schedules: false
  skills: false
  memories: false
  runCode: false
  webSearch: false
  fileSearch: false
  marketplace:
    use: false
  mcpServers:
    use: false
    create: false
    share: false
    public: false
  defaultPinnedTools: []
  contextUsage: true
  contextCost: false

transactions:
  enabled: true

balance:
  enabled: false

memory:
  disabled: true
  personalize: false

summarization:
  enabled: false

speech:
  speechTab:
    speechToText: false
    textToSpeech: false

fileConfig:
  endpoints:
    default:
      disabled: true
    agents:
      disabled: true
    custom:
      disabled: true
    MissionAI:
      disabled: true

endpoints:
  all:
    titleConvo: false
    activityLabel: false
    activityPhaseLabel: false
    reasoningLabel: false

  agents:
    disableBuilder: true
    allowedProviders: ['MissionAI']
    capabilities: []

  custom:
    - name: 'MissionAI'
      apiKey: '${GOOGLE_KEY}'
      baseURL: 'https://generativelanguage.googleapis.com/v1beta/openai'
      models:
        default: ['gemini-3.5-flash-lite']
        fetch: false
      modelDisplayLabel: 'Mission AI'
      titleConvo: false
      addParams:
        maxRetries: 0
        timeout: 180000
      dropParams:
        - useResponsesApi
        - temperature
        - top_p
        - topP
        - frequency_penalty
        - frequencyPenalty
        - presence_penalty
        - presencePenalty
        - seed
        - user
        - verbosity

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: 'mission-ai-free'
      label: 'Mission AI — Gemini 3.5 Flash Lite (Free Baseline)'
      default: true
      preset:
        endpoint: 'MissionAI'
        model: 'gemini-3.5-flash-lite'
        useResponsesApi: false
        max_tokens: 4096
