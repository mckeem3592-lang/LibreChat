name: Mission AI CI

on:
  push:
    branches: [mission-ai-v1]
    paths:
      - 'mission-ai/**'
      - 'plugin/mission-ai-budget/**'
      - '.github/workflows/mission-ai-ci.yml'
  pull_request:
    paths:
      - 'mission-ai/**'
      - 'plugin/mission-ai-budget/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          npm run check --prefix mission-ai/gateway
          node --check mission-ai/companion/companion.js
          node --check mission-ai/companion/keychain.js
          node --check mission-ai/chrome-extension/background.js
          node --check mission-ai/chrome-extension/popup.js
          node --check plugin/mission-ai-budget/scripts/budget-guard.mjs
          node --check plugin/mission-ai-budget/scripts/budget-query.mjs
          node --check plugin/mission-ai-budget/scripts/budget-report.mjs
      - name: Test Mac companion helpers
        run: node --test mission-ai/companion/*.test.js
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('mission-ai/config/router.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('mission-ai/chrome-extension/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin/mission-ai-budget/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin/mission-ai-budget/ai.librechat/hooks/hooks.json','utf8'))"
      - name: Test routing policy
        run: npm test --prefix mission-ai/gateway mission-ai/gateway/route-api.test.js mission-ai/gateway/routing-policy.test.js
