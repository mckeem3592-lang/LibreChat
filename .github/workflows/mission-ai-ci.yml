name: Mission AI CI

on:
  push:
    branches: [mission-ai-v1]
    paths:
      - 'mission-ai/**'
      - 'packages/api/src/missionBudget/**'
      - 'packages/api/src/index.ts'
      - 'api/server/index.js'
      - 'api/server/routes/agents/index.js'
      - 'plugin/mission-ai-budget/**'
      - '.github/workflows/mission-ai-ci.yml'
  pull_request:
    paths:
      - 'mission-ai/**'
      - 'packages/api/src/missionBudget/**'
      - 'packages/api/src/index.ts'
      - 'api/server/index.js'
      - 'api/server/routes/agents/index.js'
      - 'plugin/mission-ai-budget/**'
      - '.github/workflows/mission-ai-ci.yml'

permissions:
  contents: read

jobs:
  code-api-build:
    name: Build pinned Code API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: mission-ai/code-api/package-lock.json
      - name: Check Code API launch scripts
        run: |
          bash -n mission-ai/code-api/build.sh
          bash -n mission-ai/code-api/start.sh
      - name: Test locked dependency installation safeguards
        run: node --test mission-ai/code-api/build.test.mjs mission-ai/code-api/dependency-patches.test.mjs
      - name: Build Code API from reviewed dependency lock
        run: bash mission-ai/code-api/build.sh
      - name: Smoke-test installed Code API dependencies
        run: node --test mission-ai/code-api/runtime.test.mjs mission-ai/code-api/notification.test.mjs
      - name: Reject any known dependency vulnerability
        run: npm audit --prefix .mission-ai-code-api/service --package-lock-only --include=dev --ignore-scripts --audit-level=low

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mission-ai/gateway/package-lock.json
      - name: Install gateway dependencies
        run: npm ci --prefix mission-ai/gateway --include=dev --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          npm run check --prefix mission-ai/gateway
          node --check mission-ai/companion/companion.js
          node --check mission-ai/companion/keychain.js
          node --check mission-ai/chrome-extension/background.js
          node --check mission-ai/chrome-extension/popup.js
          node --check mission-ai/chrome-extension/browser-snapshot.js
          node --test mission-ai/chrome-extension/browser-snapshot.test.js
          node --check plugin/mission-ai-budget/scripts/budget-guard.mjs
          node --check plugin/mission-ai-budget/scripts/budget-query.mjs
          node --check plugin/mission-ai-budget/scripts/budget-report.mjs
          bash -n mission-ai/bootstrap-macos.sh
          bash -n mission-ai/chat-test/start.sh
          node --check mission-ai/chat-test/bootstrap.cjs
          node --check api/server/index.js
          node --check api/server/routes/agents/index.js
          bash -n mission-ai/document-tools/install-macos.sh
          bash -n mission-ai/acceptance/check-macos.sh
          python3 -m py_compile mission-ai/document-tools/verify.py
      - name: Test Mac companion helpers
        run: node --test mission-ai/companion/*.test.js
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('mission-ai/config/router.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('mission-ai/config/provider-catalog.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('mission-ai/config/provider-fallbacks.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('mission-ai/config/pricing.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('mission-ai/chrome-extension/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin/mission-ai-budget/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin/mission-ai-budget/ai.librechat/hooks/hooks.json','utf8'))"
      - name: Test gateway and budget helpers
        run: |
          npm run typecheck:native --prefix mission-ai/gateway
          npm test --prefix mission-ai/gateway
      - name: Cache integration-test MongoDB binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mission-ai-mongodb
          key: mission-ai-mongodb-${{ runner.os }}-${{ runner.arch }}-8.0.17
      - name: Test accounting with isolated MongoDB
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mission-ai-mongodb
        run: npm run test:integration --prefix mission-ai/gateway
      - name: Test private owner bootstrap with isolated MongoDB
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mission-ai-mongodb
          MISSION_AI_BOOTSTRAP_MONGO_TESTS: 'true'
        run: node --test mission-ai/gateway/native-bootstrap.test.js

  managed-chat-build:
    name: Build and typecheck managed LibreChat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCARF_ANALYTICS: 'false'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install full application dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Build application and backend packages
        run: npm run frontend
      - name: Typecheck the changed API workspace
        working-directory: packages/api
        run: npx tsc --noEmit
      - name: Audit existing chat loading with simulated database latency
        env:
          E2E_CHROMIUM_CHANNEL: chrome
        run: npm run lighthouse:run
      - name: Save chat loading audit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: mission-ai-chat-loading
          path: .lighthouse/
          include-hidden-files: true
          retention-days: 7
